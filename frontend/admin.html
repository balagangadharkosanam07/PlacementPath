<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | PlacementPath</title>
    
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --admin-dark: #0f172a;
            --primary-blue: #2563eb;
            --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
        }

        body { 
            background: var(--bg-gradient);
            margin: 0;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center; /* Vertical centering for login */
            justify-content: center; /* Horizontal centering */
        }

        /* --- 1. LOGIN CARD STYLING --- */
        .login-box { 
            background: rgba(255, 255, 255, 0.98);
            padding: 50px 40px;
            border-radius: 24px; 
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .login-box h2 { color: var(--admin-dark); font-size: 1.8rem; margin: 0 0 10px; font-weight: 800; }
        .login-box p { color: #64748b; margin-bottom: 30px; font-size: 0.95rem; }

        .input-group { position: relative; margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #475569; margin-bottom: 8px; }
        
        .input-group input { 
            width: 100%; padding: 14px 16px; border: 1.5px solid #e2e8f0; 
            border-radius: 12px; font-size: 1rem; transition: 0.3s;
            background: #f8fafc; box-sizing: border-box;
        }

        .input-group input:focus {
            outline: none; border-color: var(--primary-blue);
            background: white; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .input-group i { 
            position: absolute; right: 18px; top: 43px; 
            cursor: pointer; color: #94a3b8; font-size: 1.1rem; 
        }

        .login-btn {
            width: 100%; padding: 14px; background: var(--admin-dark);
            color: white; border: none; border-radius: 12px;
            font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.3s;
        }

        .login-btn:hover { background: #1e293b; transform: translateY(-1px); }

        /* --- 2. DASHBOARD STYLING --- */
        #dashboard { 
            display: none; 
            width: 100%; 
            max-width: 1100px; 
            padding: 40px 20px;
            margin: 0 auto; /* Ensure horizontal centering */
        }

        .admin-nav { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 30px; background: var(--admin-dark);
            padding: 20px 30px; border-radius: 16px; color: white;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        .logout-btn {
            background: transparent; color: white !important;
            border: 1.5px solid white; padding: 8px 20px;
            border-radius: 8px; font-weight: 600; cursor: pointer;
            transition: 0.3s;
        }
        .logout-btn:hover { background: white; color: var(--admin-dark) !important; }

        .table-card { 
            background: white; border-radius: 16px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); overflow: hidden; 
        }

        table { width: 100%; border-collapse: collapse; }
        th { background: #f8fafc; color: #475569; text-align: left; padding: 18px; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; }
        td { padding: 18px; border-top: 1px solid #f1f5f9; color: #1e293b; }
        
        code { background: #fff1f2; color: #e11d48; padding: 4px 8px; border-radius: 4px; font-family: monospace; }
        .btn-del { color: #ef4444; border: none; background: none; cursor: pointer; font-weight: 700; }
    </style>
</head>
<body>

    <div id="loginSection" class="login-box">
        <h2>Admin Access</h2>
        <p>Verify your credentials to enter the database.</p>
        
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="adminUser" placeholder="Enter username">
        </div>
        
        <div class="input-group">
            <label>Master Password</label>
            <input type="password" id="adminPass" placeholder="Enter password">
            <i class="fa-regular fa-eye" id="toggleEye"></i>
        </div>
        
        <button onclick="checkAdmin()" class="login-btn">Secure Login</button>
    </div>

    <div id="dashboard">
        <div class="admin-nav">
            <h2 style="margin:0;">PlacementPath <span style="font-weight:300; opacity:0.7;">| Database</span></h2>
            <button onclick="adminLogout()" class="logout-btn">Logout</button>
        </div>

        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Registered On</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="userList">
                    </tbody>
            </table>
        </div>
    </div>
    
<script src="js/config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
